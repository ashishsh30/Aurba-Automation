name: Push JSON Variables to Aruba Central

on:
  push:
    branches: [ main ]
    paths:
      - 'var.json'
      - 'push_vars.py'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Variable Push Script
        env:
          CENTRAL_ACCESS_TOKEN: ${{ secrets.CENTRAL_ACCESS_TOKEN }}
        run: python push_vars.py
