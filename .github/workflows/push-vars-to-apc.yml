name: Push Variables to APC Group

on:
  push:
    paths:
      - 'vars.json'
  workflow_dispatch:
    inputs:
      target_group_id:
        description: 'Enter APC Group ID or Name'
        required: true
        default: '5'

jobs:
  push-variables-to-apc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Send Variables directly to APC Group API
        run: |
          # Use input value if manually triggered, fallback to group '5' on automatic push
          GROUP_ID="${{ inputs.target_group_id || '5' }}"
          VARS_PAYLOAD=$(cat vars.json)

          curl -X PATCH "${{ secrets.APC_HOST }}/api/v1/groups/${GROUP_ID}/variables" \
            -H "Authorization: Bearer ${{ secrets.APC_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$VARS_PAYLOAD"
