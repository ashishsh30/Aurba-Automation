name: Push Variables to APC Group

on:
  push:
    paths:
      - 'vars.json'
  workflow_dispatch:

env:
  APC_GROUP_ID: "Test-new"  # Target Group Name/ID

jobs:
  push-variables-to-apc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Send Variables directly to APC Group API
        env:
          APC_HOST: ${{ secrets.APC_HOST }}
          APC_TOKEN: ${{ secrets.APC_TOKEN }}
        run: |
          # Verify host secret is populated
          if [ -z "$APC_HOST" ]; then
            echo "Error: APC_HOST secret is missing or empty."
            exit 1
          fi

          VARS_PAYLOAD=$(cat vars.json)

          curl -X PATCH "${APC_HOST}/api/v1/groups/${APC_GROUP_ID}/variables" \
            -H "Authorization: Bearer ${APC_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$VARS_PAYLOAD"
