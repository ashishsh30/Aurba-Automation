name: Push Variables to Aruba Central Group

on:
  push:
    paths:
      - 'vars.json'
  workflow_dispatch:

env:
  ARUBA_HOST: "https://app2-ap.central.arubanetworks.com"
  ARUBA_GROUP_ID: "Test-new"  # Matches cgid=47 from your URL

jobs:
  push-variables-to-aruba:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Push Variables to Aruba Central Group API
        env:
          ARUBA_TOKEN: ${{ secrets.ARUBA_TOKEN }}
        run: |
          # Verify access token exists
          if [ -z "$ARUBA_TOKEN" ]; then
            echo "Error: ARUBA_TOKEN secret is missing."
            exit 1
          fi

          # Read variables from vars.json
          VARS_PAYLOAD=$(cat vars.json)

          # Send POST/PATCH request to Aruba Central Group configuration API
          curl -X POST "${ARUBA_HOST}/configuration/v1/groups/${ARUBA_GROUP_ID}/variables" \
            -H "Authorization: Bearer ${ARUBA_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$VARS_PAYLOAD"
