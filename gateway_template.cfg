# ====================================================================

# ARUBA CENTRAL GATEWAY GROUP TEMPLATE (AOS-8 / AOS-10)

# ====================================================================



# Gateway System Identity

hostname %_sys_hostname%



# Admin Credentials (Required by Central for Gateway Templates)

user mgmt %admin_username% password %admin_password%



# Timezone & NTP Settings

clock timezone %timezone%

ntp server %ntp_primary% iburst

%if ntp_secondary%

ntp server %ntp_secondary% iburst

%endif%



# --------------------------------------------------------------------

# VLAN & IP INTERFACE DEFINITIONS

# --------------------------------------------------------------------

vlan %wan_vlan_id%

vlan %lan_vlan_id%

vlan %guest_vlan_id%



# WAN Interface (Uplink to ISP / Internet)

interface vlan %wan_vlan_id%

    ip address %wan_ip% %wan_mask%

    ip default-gateway %wan_gateway%

    description "WAN Gateway Interface"



# LAN Local Gateway Interface (SVI)

interface vlan %lan_vlan_id%

    ip address %lan_gateway_ip% %lan_netmask%

    description "Local LAN Gateway"



# --------------------------------------------------------------------

# PHYSICAL PORT ASSIGNMENTS

# --------------------------------------------------------------------



# WAN Port (Connected to Modem / ISP Router)

interface gigabitethernet %wan_port%

    switchport access vlan %wan_vlan_id%

    description "ISP Trunk / WAN Connection"

    no shutdown



# LAN Port (Trunk to Access Switch)

interface gigabitethernet %lan_port%

    switchport mode trunk

    switchport trunk native vlan %lan_vlan_id%

    switchport trunk allowed vlan %lan_vlan_id%,%guest_vlan_id%

    description "LAN Trunk to Switch"

    no shutdown



# --------------------------------------------------------------------

# DHCP POOL CONFIGURATION

# --------------------------------------------------------------------

ip dhcp pool LAN_POOL

    default-router %lan_gateway_ip%

    dns-server %dns_primary% %dns_secondary%

    network %lan_network_ip% %lan_netmask%

    lease 0 8 0



# --------------------------------------------------------------------

# FIREWALL / NAT CONFIGURATION

# --------------------------------------------------------------------

# Source NAT for Outbound WAN Traffic

ip nat inside-source list any interface vlan %wan_vlan_id% overload



# Banner Configuration

banner motd @

